<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Travelit</title>
    <script>
      // GitHub Pages SPA 리다이렉트 트릭
      // 404 발생 시 경로를 쿼리 파라미터로 변환하여 index.html로 전달
      var segmentCount = 1; // basePath depth (/Travelit = 1)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
