name: CI - PR 체크

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    name: 백엔드 테스트 (NestJS + Jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app_user
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: app_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: 백엔드 의존성 설치
        run: npm ci
        working-directory: backend

      - name: Jest 테스트 실행
        env:
          DATABASE_URL: postgresql://app_user:testpassword@localhost:5432/app_test
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_EXPIRES_IN: 1h
          NODE_ENV: test
        run: npm test
        working-directory: backend

  build:
    name: Docker 빌드 확인
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 백엔드 이미지 빌드 테스트
        run: docker build -f backend/Dockerfile -t travelit-backend:test ./backend

      - name: 프론트엔드 이미지 빌드 테스트
        run: docker build -f frontend/Dockerfile -t travelit-frontend:test ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
