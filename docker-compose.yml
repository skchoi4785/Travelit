services:
  # PostgreSQL 데이터베이스
  postgres:
    image: postgres:16-alpine
    container_name: travelit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: travelit_db
      POSTGRES_USER: travelit_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travelit_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelit_user -d travelit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS 백엔드 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelit-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://travelit_user:${POSTGRES_PASSWORD:-travelit_password}@postgres:5432/travelit_db
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Next.js 프론트엔드
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: travelit-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
